<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Agente Financeiro</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:#f4f7fa}
    .login{width:calc(100% - 32px);max-width:420px;background:white;padding:35px;border-radius:18px;box-shadow:0 8px 30px #0000001a}
    h1{text-align:center;color:#123b5d;margin-top:0}
    .subtitulo{text-align:center;color:#667781;margin-bottom:30px}
    label{display:block;margin-bottom:7px;font-weight:bold;color:#123b5d}
    input{width:100%;padding:13px;margin-bottom:18px;border:1px solid #ccd6de;border-radius:8px;font-size:15px}
    button{width:100%;padding:14px;border:0;border-radius:8px;background:#1769aa;color:white;font-size:16px;font-weight:bold;cursor:pointer}
    button:hover{background:#0e568e}
    .erro{background:#ffe8e8;color:#a40000;padding:12px;border-radius:8px;margin-bottom:20px;text-align:center}
    .sucesso{background:#e6f6ed;color:#17663a;padding:12px;border-radius:8px;margin-bottom:20px;text-align:center}
    .hidden{display:none}
  </style>
</head>
<body>
  <main class="login">
    <h1>Agente Financeiro</h1>
    <p class="subtitulo">Acesso ao sistema de processamento de notas fiscais</p>

    <div id="erro" class="erro hidden">Usuário ou senha inválidos.</div>

    <form method="POST" action="/login">
      <label for="login">Login</label>
      <input type="text" id="login" name="login"
             placeholder="Digite seu login"
             autocomplete="username" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha"
             placeholder="Digite sua senha"
             autocomplete="current-password" required>

      <button type="submit">ENTRAR</button>
    </form>
    <p><button id="mostrarCadastro" type="button">Criar conta de pessoa</button></p>
    <form id="cadastro" class="hidden">
      <label for="loginCadastro">Login</label>
      <input id="loginCadastro" name="login" minlength="3" maxlength="32"
             pattern="[A-Za-z0-9._-]{3,32}" autocomplete="username"
             title="Use de 3 a 32 letras, números, ponto, hífen ou sublinhado." required>
      <label for="senhaCadastro">Senha (mínimo de 8 caracteres)</label>
      <input id="senhaCadastro" name="senha" type="password" minlength="8" autocomplete="new-password" required>
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" maxlength="50" autocomplete="email" required>
      <label for="telefone">Telefone</label>
      <input id="telefone" name="telefone" inputmode="numeric" maxlength="15" autocomplete="tel">
      <label for="documento">CPF ou CNPJ</label>
      <input id="documento" name="cpf_cnpj" inputmode="numeric" maxlength="14"
             placeholder="Somente números (CPF 11 ou CNPJ 14 dígitos)" required>
      <label for="nome">Nome completo</label>
      <input id="nome" name="nome" maxlength="50" required>
      <label for="nascimento">Data de nascimento do titular da conta</label>
      <input id="nascimento" name="data_nascimento" type="date" required>
      <small id="idadeCalculada"></small>
      <div id="responsavelCampos" class="hidden">
        <label for="responsavelNome">Nome do responsável legal</label>
        <input id="responsavelNome" name="responsavel_nome">
        <label for="responsavelCpf">CPF do responsável</label>
        <input id="responsavelCpf" name="responsavel_cpf" inputmode="numeric" maxlength="11">
        <label><input id="autorizacao" name="autorizacao_responsavel" type="checkbox"> O responsável confirma que autoriza o cadastro.</label>
      </div>
      <button type="submit">CADASTRAR</button>
    </form>
    <div id="cadastroMsg" class="hidden"></div>
    <div style="margin-top:20px;text-align:center;font-size:12px;color:#667781">Versão / Última Atualização: <a id="loginGithubLink" href="https://github.com/Vini-p11/Paraiba" target="_blank" rel="noopener noreferrer" style="color:#1769aa;font-weight:bold;text-decoration:underline"><span class="ver-code">v1.0.0</span></a></div>
  </main>

  <script>
    const parametros = new URLSearchParams(window.location.search);

    if (parametros.get('erro') === '1') {
      document.getElementById('erro').classList.remove('hidden');
    }

    const cadastro = document.getElementById('cadastro');
    const responsavelCampos = document.getElementById('responsavelCampos');
    const cadastroMsg = document.getElementById('cadastroMsg');
    const idadeCalculada = document.getElementById('idadeCalculada');
    const idadeEm = valor => {
      if (!valor) return null;
      const nascimento = new Date(`${valor}T00:00:00`);
      const hoje = new Date();
      return hoje.getFullYear() - nascimento.getFullYear()
        - ((hoje.getMonth() < nascimento.getMonth()
          || (hoje.getMonth() === nascimento.getMonth() && hoje.getDate() < nascimento.getDate())) ? 1 : 0);
    };

    document.getElementById('mostrarCadastro').addEventListener('click', () => {
      cadastro.classList.toggle('hidden');
      document.querySelector('form[action="/login"]').classList.toggle('hidden');
    });
    document.getElementById('nascimento').addEventListener('change', event => {
      const idade = idadeEm(event.target.value);
      idadeCalculada.textContent = idade === null ? '' : `Idade: ${idade} anos`;
      const menor = idade !== null && idade < 18;
      responsavelCampos.classList.toggle('hidden', !menor);
      for (const input of responsavelCampos.querySelectorAll('input')) input.required = menor;
    });
    for (const id of ['documento', 'responsavelCpf']) {
      document.getElementById(id).addEventListener('input', event => {
        const limite = id === 'documento' ? 14 : 11;
        event.target.value = event.target.value.replace(/\D/g, '').slice(0, limite);
      });
    }
    document.getElementById('telefone').addEventListener('input', event => {
      event.target.value = event.target.value.replace(/\D/g, '').slice(0, 15);
    });
    document.getElementById('nome').addEventListener('input', event => {
      event.target.value = event.target.value.replace(/[^\p{L}\s]/gu, '').slice(0, 50);
    });
    cadastro.addEventListener('submit', async event => {
      event.preventDefault();
      cadastroMsg.className = 'hidden';
      const dados = Object.fromEntries(new FormData(cadastro));
      dados.autorizacao_responsavel = document.getElementById('autorizacao').checked;
      try {
        const resposta = await fetch('/api/cadastro', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(dados)
        });
        const resultado = await resposta.json();
        if (!resposta.ok) throw new Error(resultado.detail || 'Não foi possível cadastrar.');
        cadastroMsg.textContent = resultado.mensagem;
        cadastroMsg.className = 'sucesso';
        cadastro.reset();
        responsavelCampos.classList.add('hidden');
      } catch (erro) {
        cadastroMsg.textContent = erro.message;
        cadastroMsg.className = 'erro';
      }
    });
    fetch('/api/health').then(r=>r.json()).then(d=>{
      const ver=d.versao||'v1.0.0';
      const url=d.github_url||'https://github.com/Vini-p11/Paraiba';
      document.querySelectorAll('.ver-code').forEach(el=>el.textContent=ver);
      const a=document.getElementById('loginGithubLink');
      if(a)a.href=(ver&&ver!=='v1.0.0'&&!ver.startsWith('v'))?`${url}/commit/${ver}`:url;
    }).catch(()=>{});
  </script>
</body>
</html>
